name: Feature request
description: Suggest an improvement for DopWatch.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this feature solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should DopWatch do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Any simpler alternatives or related tools?
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Android permissions
        - Dashboard
        - Settings
        - LINE integration
        - Beeminder integration
        - Local API
        - Documentation
        - Other
